name: Build Roxy AI - Desktop (EXE) & Mobile (APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build Windows EXE / MSI via Tauri
  # ─────────────────────────────────────────
  build-windows:
    name: 🖥️ Build Windows App (Tauri EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npx vite build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Copy index.old.html to index.html in dist
        run: |
          if (Test-Path "dist/index.old.html") {
            Copy-Item "dist/index.old.html" "dist/index.html" -Force
          }
        shell: pwsh

      - name: Build Tauri Desktop App
        run: npx tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: roxy-ai-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows NSIS EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: roxy-ai-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ─────────────────────────────────────────
  # JOB 2: Build Android APK via Capacitor
  # ─────────────────────────────────────────
  build-android:
    name: 📱 Build Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npx vite build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Copy index.old.html to index.html in dist
        run: |
          if [ -f "dist/index.old.html" ]; then
            cp dist/index.old.html dist/index.html
          fi

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roxy-ai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
