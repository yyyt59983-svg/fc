name: Build Roxy AI - Desktop (EXE) & Mobile (APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build Windows EXE / MSI via Tauri
  # ─────────────────────────────────────────
  build-windows:
    name: 🖥️ Build Windows App (Tauri EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Generate Cargo.lock
        shell: pwsh
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Ensure dist/index.html exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) {
            if (Test-Path "dist/index.old.html") {
              Copy-Item "dist/index.old.html" "dist/index.html" -Force
              Write-Host "Copied index.old.html to index.html"
            } else {
              Write-Host "WARNING: No index.html found in dist"
            }
          } else {
            Write-Host "dist/index.html already exists"
          }

      - name: Build Tauri Desktop App (Windows)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: roxy-ai-windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows NSIS EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: roxy-ai-windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ─────────────────────────────────────────
  # JOB 2: Build Android APK via Capacitor
  # ─────────────────────────────────────────
  build-android:
    name: 📱 Build Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Ensure dist/index.html exists
        run: |
          if [ ! -f "dist/index.html" ]; then
            if [ -f "dist/index.old.html" ]; then
              cp dist/index.old.html dist/index.html
              echo "Copied index.old.html to index.html"
            else
              echo "WARNING: No index.html in dist"
            fi
          else
            echo "dist/index.html already exists"
          fi

      - name: Create android/local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Created local.properties:"
          cat android/local.properties

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roxy-ai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
